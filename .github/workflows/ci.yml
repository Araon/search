name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Lint server code
        working-directory: ./server
        run: |
          if [ -f "node_modules/.bin/eslint" ]; then
            npm run lint || echo "No lint script found, skipping..."
          else
            echo "ESLint not installed, skipping lint step"
          fi
        continue-on-error: true

      - name: Run server tests
        working-directory: ./server
        run: npm test -- --coverage --watchAll=false --maxWorkers=2
        env:
          NODE_ENV: test
          MONGO_DB_URI: mongodb://localhost:27017/test_anime_collection
          CHROMA_DB_URI: http://localhost:8000
        continue-on-error: false

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Lint client code
        working-directory: ./client
        run: |
          if [ -f "node_modules/.bin/eslint" ]; then
            npm run lint || echo "No lint script found, skipping..."
          else
            echo "ESLint not installed, skipping lint step"
          fi
        continue-on-error: true

      - name: Run client tests
        working-directory: ./client
        run: npm test -- --coverage --watchAll=false --maxWorkers=2
        env:
          CI: true
        continue-on-error: false

  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build client
        working-directory: ./client
        run: npm run build
        env:
          CI: true
          REACT_APP_PUBLIC_POSTHOG_KEY: ${{ secrets.REACT_APP_PUBLIC_POSTHOG_KEY || 'test-key' }}
          REACT_APP_PUBLIC_POSTHOG_HOST: ${{ secrets.REACT_APP_PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}

      - name: Check build artifacts
        run: |
          if [ -d "client/build" ]; then
            echo "✅ Build successful - build directory exists"
            ls -la client/build/
          else
            echo "❌ Build failed - no build directory found"
            exit 1
          fi

  test-coverage:
    runs-on: ubuntu-latest
    needs: [lint-and-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Generate server coverage
        working-directory: ./server
        run: npm test -- --coverage --watchAll=false --maxWorkers=2
        env:
          NODE_ENV: test
          MONGO_DB_URI: mongodb://localhost:27017/test_anime_collection
          CHROMA_DB_URI: http://localhost:8000

      - name: Generate client coverage
        working-directory: ./client
        run: npm test -- --coverage --watchAll=false --maxWorkers=2
        env:
          CI: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: |
            ./server/coverage/coverage-final.json
            ./client/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

